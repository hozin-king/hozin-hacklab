apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.hozinking.hacklab"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.4"
    }

    // Keystore debug PERSISTEN (di repo root, di-.gitignore, TIDAK
    // pernah ter-push): sertifikat build tidak berubah tiap run CI.
    // Config ini HANYA dibuat bila file keystore ada (AGP memvalidasi
    // file-nya di CI — config yang menunjuk file yang tidak ada
    // membuat CI merah).
    signingConfigs {
        if (file("../debug.keystore").exists()) {
            debug {
                storeFile file("../debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("../debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// No dependencies on purpose: framework + Kotlin stdlib only.
// Lessons, the simulator and the mini-games stay fully offline; only
// the companion YouTube videos and the lesson-catalog sync use the
// network. JUnit is test-only, for the lab-engine unit tests.
dependencies {
    testImplementation "junit:junit:4.13.2"
}
