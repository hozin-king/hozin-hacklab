apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.hozinking.hacklab"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

// No dependencies on purpose: framework + Kotlin stdlib only.
// Lessons, the simulator and the mini-games stay fully offline; only
// the companion YouTube videos and the lesson-catalog sync use the
// network. JUnit is test-only, for the lab-engine unit tests.
dependencies {
    testImplementation "junit:junit:4.13.2"
}
